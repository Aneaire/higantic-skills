[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "higantic-cli"
version = "1.8.2"
description = "Shared command-line interface for HiGantic authentication, diagnostics, HTML Artifacts, managed images, and Canvas diagrams."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "HiGantic" }]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Topic :: Utilities",
]

[project.scripts]
higantic = "higantic_cli.higantic_html:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["higantic_cli*"]
