name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.x"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build live-reference site
        run: node scripts/build-site.mjs

      - name: Check deterministic site output
        run: node scripts/test-site.mjs

      - name: Validate source and generated JSON
        run: |
          python3 -m json.tool site/v1/manifest.source.json >/dev/null
          python3 -m json.tool site/v1/references/higantic-html-artifacts.json >/dev/null
          python3 -m json.tool skills/higantic-html-artifacts/references/live-reference.json >/dev/null
          python3 -m json.tool skills/higantic-html-artifacts/references/live-reference-fallback.json >/dev/null
          python3 -m json.tool dist/v1/manifest.json >/dev/null
          python3 -m json.tool dist/v1/references/higantic-html-artifacts.json >/dev/null
          python3 -m json.tool skills.sh.json >/dev/null
          python3 -m json.tool evals/higantic-html-artifacts/evals.json >/dev/null

      - name: Run all Python tests
        run: |
          python3 -m unittest discover -s tests/higantic-html-artifacts -p 'test_*.py'
          python3 -m unittest discover -s tests/cli -p 'test_*.py'

      - name: Pack and install standalone npm CLI
        run: |
          npm --prefix cli test
          package_file=$(npm pack ./cli --ignore-scripts --pack-destination /tmp --silent)
          npm install --global "/tmp/$package_file"
          higantic --version
          higantic doctor --offline --json

      - name: Compile all Python files
        run: python3 -m py_compile cli/higantic_cli/*.py skills/higantic-html-artifacts/scripts/*.py scripts/validate_repository.py tests/cli/*.py tests/higantic-html-artifacts/*.py

      - name: Validate repository structure
        run: python3 scripts/validate_repository.py
